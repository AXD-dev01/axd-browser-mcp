name: Test & Verify @axd/browser-mcp

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify package integrity
        run: node -e "console.log('Testing @axd/browser-mcp syntax...'); require('./src/index.js');" || true

      - name: Check package metadata
        run: npm pack --dry-run
